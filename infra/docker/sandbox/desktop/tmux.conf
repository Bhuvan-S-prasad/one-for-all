# The terminal on each agent's desktop (ADR-0040): one tmux session, "main",
# that the agent's commands can be shown in (DT.06) and a person can use.
set -g default-terminal "xterm-256color"
set -g history-limit 20000
set -g mouse on
set -g status-position bottom
set -g status-style "bg=#161618,fg=#a8a8ad"
set -g status-left " "
set -g status-right "#[fg=#d4ff3a]●#[default] #{session_name} "
set -g window-status-current-style "fg=#f4f4f0"
set -g pane-border-style "fg=#26262a"
set -g pane-active-border-style "fg=#d4ff3a"
set -g message-style "bg=#26262a,fg=#f4f4f0"
