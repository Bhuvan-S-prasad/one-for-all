# One-for-All self-hosted bundle (ARCHITECTURE.md §14.1).
#
# First time:
#   sh infra/scripts/init-env.sh                                  # writes infra/compose/.env with secrets
#   docker compose -f infra/compose/docker-compose.selfhost.yml up -d --build
#   open http://localhost:3000
#
# Only the app is published, and only on 127.0.0.1 (ADR-0017). Postgres and
# Inngest are reachable only on the internal Compose network. The agents'
# computer (sandbox) sits on its own network with no route out except the
# egress proxy (ADR-0025).
#
# Later milestones add optional Phoenix and Ollama profiles.

name: one-for-all

x-db-names: &db-names
  POSTGRES_USER: ${POSTGRES_USER:-oneforall}
  POSTGRES_DB: ${POSTGRES_DB:-oneforall}
  APP_DB_USER: ${APP_DB_USER:-oneforall_app}

services:
  app:
    image: ${OFA_IMAGE:-one-for-all:local}
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OFA_MODE: self-host
      # Must match the address you open in the browser, including the port.
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-3000}}
      # Extra host names to accept, comma-separated (e.g. a Tailscale name).
      # `app:3000` is how the Inngest container reaches the app; its requests
      # are signed with INNGEST_SIGNING_KEY.
      ALLOWED_HOSTS: app:3000,${ALLOWED_HOSTS:-}
      DATABASE_URL: postgres://${APP_DB_USER:-oneforall_app}:${APP_DB_PASSWORD:?run infra/scripts/init-env.sh first}@postgres:5432/${POSTGRES_DB:-oneforall}
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER:-oneforall}:${POSTGRES_PASSWORD:?run infra/scripts/init-env.sh first}@postgres:5432/${POSTGRES_DB:-oneforall}
      AUTH_SECRET: ${AUTH_SECRET:?run infra/scripts/init-env.sh first}
      VAULT_KEY: ${VAULT_KEY:?run infra/scripts/init-env.sh first}
      INNGEST_DEV: "0"
      INNGEST_BASE_URL: http://inngest:8288
      SEARXNG_URL: http://searxng:8080
      # The agents' computer, reached through the egress container.
      SANDBOX_URL: http://egress:7070
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?add SANDBOX_TOKEN to infra/compose/.env (see infra/scripts/init-env.sh)}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?run infra/scripts/init-env.sh first}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?run infra/scripts/init-env.sh first}
      # Model provider (ADR-0022). Keys are saved per workspace in Settings.
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODELS_FAST: ${LLM_MODELS_FAST:-}
      LLM_MODELS_STANDARD: ${LLM_MODELS_STANDARD:-}
      LLM_MODELS_STRONG: ${LLM_MODELS_STRONG:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    mem_limit: 768m

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      <<: *db-names
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run infra/scripts/init-env.sh first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run infra/scripts/init-env.sh first}
      INNGEST_DB: inngest
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g

  inngest:
    image: inngest/inngest:v1.45.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Inngest calls the app's functions at /api/inngest.
    command: >-
      inngest start
      -u http://app:3000/api/inngest
      --event-key ${INNGEST_EVENT_KEY:?run infra/scripts/init-env.sh first}
      --signing-key ${INNGEST_SIGNING_KEY:?run infra/scripts/init-env.sh first}
      --postgres-uri postgres://${POSTGRES_USER:-oneforall}:${POSTGRES_PASSWORD:?run infra/scripts/init-env.sh first}@postgres:5432/inngest
    mem_limit: 512m

  # Web search for agents. Internal only: reachable from the app, not the host.
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run infra/scripts/init-env.sh first}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m

  # The agents' computer (M3, ADR-0025): Chromium per agent, a shell and
  # files, each agent as its own user. Hardened here, where it is enforced.
  sandbox:
    image: ${OFA_SANDBOX_IMAGE:-one-for-all-sandbox:local}
    build: ../docker/sandbox
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?add SANDBOX_TOKEN to infra/compose/.env (see infra/scripts/init-env.sh)}
      SANDBOX_PROXY: http://egress:3128
    networks: [sandbox]
    volumes:
      - sandbox-home:/home/agents
      - sandbox-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /run
    shm_size: 512m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 1.5
    # Threads count too: a browser uses ~60.
    pids_limit: 2048

  # The sandbox's only way out (M3.02): allowlisted HTTP(S), never private
  # addresses. Also forwards :7070 so the app reaches the sandbox service
  # without joining the sandbox network.
  egress:
    image: ${OFA_SANDBOX_IMAGE:-one-for-all-sandbox:local}
    build: ../docker/sandbox
    restart: unless-stopped
    command: ["node", "/opt/sandbox/egress.mjs"]
    user: "1000:1000"
    environment:
      # Domains the sandbox may reach (each covers its subdomains), or * for any
      # public site. Private addresses are refused whatever this says.
      EGRESS_ALLOW: ${SANDBOX_EGRESS_ALLOW:-*}
      EGRESS_FORWARD: 7070:sandbox:7070
    networks: [sandbox, default]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3128,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default: {}
  # No route out: the sandbox reaches only the egress proxy.
  sandbox:
    internal: true

volumes:
  postgres-data:
  sandbox-home:
  sandbox-workspace:
