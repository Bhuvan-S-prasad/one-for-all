# Development infrastructure. Our own code runs natively with `pnpm dev`;
# only the services it depends on run here.
#
#   pnpm infra:up     start (waits until healthy)
#   pnpm infra:down   stop, keep data
#   pnpm infra:reset  stop and DELETE all data
#
# Every port binds to 127.0.0.1 only (ADR-0017). Override defaults with
# environment variables in your shell.

name: one-for-all-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # Owner role: runs migrations. Superuser inside this container.
      POSTGRES_USER: ${POSTGRES_USER:-oneforall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oneforall_dev}
      POSTGRES_DB: ${POSTGRES_DB:-oneforall}
      # App role: used by the running app. Not a superuser and not the table
      # owner, so row-level security applies to it (ADR-0001).
      APP_DB_USER: ${APP_DB_USER:-oneforall_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-oneforall_app_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  inngest:
    image: inngest/inngest:v1.45.1
    restart: unless-stopped
    # The dev server discovers the app's Inngest endpoint on the host.
    command: inngest dev -u http://host.docker.internal:${API_PORT:-3000}/api/inngest
    ports:
      - "127.0.0.1:${INNGEST_PORT:-8288}:8288"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Web search for agents (web.search). JSON API at http://127.0.0.1:8888.
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-searxng-secret-not-for-production}
      SEARXNG_BASE_URL: http://127.0.0.1:${SEARXNG_PORT:-8888}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    mem_limit: 256m

  # The agents' computer (M3, ADR-0025). Only on the internal `sandbox`
  # network: its one way out is the egress proxy below. Hardened here, where
  # it is enforced: read-only root, minimal capabilities, no new privileges,
  # limits, and no host mounts or Docker socket.
  sandbox:
    image: one-for-all-sandbox:local
    build: ../docker/sandbox
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-ofa-sandbox-dev-token}
      SANDBOX_PROXY: http://egress:3128
    networks: [sandbox]
    volumes:
      - sandbox-home:/home/agents
      - sandbox-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /run
    shm_size: 512m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 1.5
    # Threads count too: a browser uses ~60.
    pids_limit: 2048

  # The sandbox's exit (M3.02): an allowlisting HTTP(S) proxy that never
  # reaches private addresses. It also forwards :7070 to the sandbox service,
  # so the app (on the host here) can reach it.
  egress:
    image: one-for-all-sandbox:local
    build: ../docker/sandbox
    restart: unless-stopped
    command: ["node", "/opt/sandbox/egress.mjs"]
    user: "1000:1000"
    environment:
      EGRESS_ALLOW: ${SANDBOX_EGRESS_ALLOW:-*}
      EGRESS_FORWARD: 7070:sandbox:7070
    networks: [sandbox, default]
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-7070}:7070"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3128,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default: {}
  # No route out: the sandbox reaches only the egress proxy.
  sandbox:
    internal: true

volumes:
  postgres-data:
  sandbox-home:
  sandbox-workspace:
